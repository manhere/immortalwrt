name: Build Meraki Z1 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -hT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc \
            make gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev \
            file wget python3 python3-distutils 2>/dev/null || \
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc \
            make gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev \
            file wget python3

      - name: Update & install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure (ath79/nand, Meraki Z1)
        run: |
          make defconfig
          cat >> .config <<'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_nand=y
          CONFIG_TARGET_ath79_nand_DEVICE_meraki_z1=y
          EOF
          make defconfig
          grep -E "^(CONFIG_TARGET_ath79|CONFIG_TARGET_BOARD)" .config

      - name: Download packages
        run: |
          make download -j$(nproc) || make download -j1 V=s

      - name: Compile firmware
        run: |
          set -o pipefail
          echo "CPU threads: $(nproc)"
          rm -f build.log
          make -j$(nproc) 2>&1 | tee build.log &
          MAKE_PID=$!
          # Watchdog: every 5 min print last log lines + disk/mem/process state,
          # so a silent stall (e.g. a tool waiting on stdin) becomes visible.
          for i in $(seq 1 180); do
            sleep 60
            kill -0 $MAKE_PID 2>/dev/null || break
            if [ $((i % 5)) -eq 0 ]; then
              echo "===== heartbeat $(date -u +%H:%M) UTC ====="
              echo "--- last log lines:"
              tail -2 build.log || true
              echo "--- disk / memory / top processes:"
              df -h / | tail -1
              free -h | sed -n '2p'
              ps -eo pcpu,pmem,etime,comm --sort=-pcpu | head -8
            fi
          done
          wait $MAKE_PID || RC=$?
          RC=${RC:-0}
          if [ "$RC" -ne 0 ]; then
            echo "::warning::parallel build failed (rc=$RC), retrying with -j1 V=s"
            make -j1 V=s 2>&1 | tee -a build.log
          fi
          echo "=== tail of build log ==="
          tail -15 build.log
          df -hT

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-meraki-z1
          path: |
            bin/targets/ath79/nand/*meraki_z1*
            bin/targets/ath79/nand/sha256sums
            .config
          retention-days: 30
          if-no-files-found: error

      - name: Upload build logs on failure or cancellation
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            logs/
          if-no-files-found: ignore
          retention-days: 7
